<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Music Box</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
    .sub { text-align: center; color: #666; margin-bottom: 16px; font-size: 14px; }
    .scan-row {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .scan-row input {
      flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
    }
    .menu-item {
      display: flex; align-items: center; justify-content: space-between;
      background: white; border-radius: 10px; padding: 12px; margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .menu-item-name { flex: 1; }
    .menu-item-name small { color: #888; display: block; }
    .menu-item-price { width: 70px; text-align: right; color: #c00000; font-weight: 600; }
    .qty-control { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: #c00000; color: white; font-size: 18px; cursor: pointer;
    }
    .qty-val { min-width: 24px; text-align: center; font-weight: 600; }
    .cart {
      position: sticky; bottom: 0; background: white; border-radius: 12px 12px 0 0;
      padding: 16px; box-shadow: 0 -4px 16px rgba(0,0,0,0.12); margin-top: 16px;
    }
    .cart h3 { margin-bottom: 8px; }
    .cart-line { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; }
    .cart-total { font-weight: bold; font-size: 18px; color: #c00000; margin-top: 8px; }
    .btn-send {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #70ad47; color: white; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 12px;
    }
    .btn-send:disabled { background: #aaa; }
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: #333; color: white; padding: 12px 20px; border-radius: 8px;
      display: none; z-index: 100;
    }
    .toast.show { display: block; }
    .note-input {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
      margin-top: 8px; font-size: 14px;
    }
    .menu-cat {
      margin-bottom: 10px; border-radius: 10px; overflow: hidden;
      border: 1px solid #e0e0e0; background: #fff;
    }
    .menu-cat-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; background: #7a1f1f; color: #fff;
      font-weight: 600; cursor: pointer; user-select: none;
    }
    .menu-cat.collapsed .menu-cat-body { display: none; }
    .menu-cat.collapsed .arrow { transform: rotate(-90deg); }
    .arrow { transition: transform 0.2s; font-size: 12px; }
    .menu-cat-body { padding: 4px 8px; background: #faf8f5; }
    .menu-item-img {
      width: 52px; height: 52px; object-fit: cover; border-radius: 8px;
      background: #eee; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>Music Box — Menu</h1>
  <div class="sub" id="boxLabel">Đang tải...</div>

  <div class="scan-row">
    <input type="text" id="barcodeInput" placeholder="Quét mã vạch món..." autocomplete="off">
  </div>

  <div id="menuList"></div>

  <div class="cart">
    <h3>Đã chọn</h3>
    <div id="cartLines"></div>
    <div class="cart-total">Tổng: <span id="cartTotal">0</span> đ</div>
    <input class="note-input" id="orderNote" placeholder="Ghi chú (tuỳ chọn)">
    <button class="btn-send" id="btnSend" disabled>Gửi order cho quầy</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const BOX = parseInt(params.get('box') || '0', 10);
    let MENU = [];
    let SHEET_API = '';
    let qtyMap = {};

    function money(n) { return Math.round(n).toLocaleString('vi-VN'); }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    let ROOM_OK = false;

    async function loadConfig() {
      try {
        const res = await fetch('config.json?t=' + Date.now());
        const cfg = await res.json();
        SHEET_API = (cfg.sheetApiUrl || '').trim();
      } catch (e) {
        SHEET_API = '';
      }
      if (!BOX || BOX < 1 || BOX > 6) {
        document.getElementById('boxLabel').textContent = 'Thiếu số phòng (?box=1)';
        return;
      }
      // MENU 100% từ Inventory_quantity
      MENU = [];
      if (SHEET_API) {
        try {
          const ir = await fetch(SHEET_API + '?action=inventory&t=' + Date.now());
          const idata = await ir.json();
          if (idata.ok && idata.items) {
            MENU = idata.items.map(it => ({
              id: String(it.code || ''),
              code: String(it.code || ''),
              category: it.category || 'Khác',
              name: it.name || '',
              price: Number(it.price) || 0,
              cost: Number(it.cost) || 0,
              stock: Number(it.stock) || 0,
              image: it.image || ''
            })).filter(m => m.code);
          }
        } catch (_) {}
      }
      if (!MENU.length) {
        document.getElementById('boxLabel').textContent = 'BOX ' + BOX + ' — chưa có menu trên Sheet';
        document.getElementById('menuList').innerHTML = '<p style="text-align:center;color:#c00000;padding:20px;">Không tải được Inventory_quantity</p>';
        return;
      }
      document.getElementById('boxLabel').textContent = 'Phòng BOX ' + BOX + ' — đang kiểm tra...';
      await checkRoomStatus();
    }

    async function checkRoomStatus() {
      if (!SHEET_API) {
        document.getElementById('boxLabel').textContent = 'BOX ' + BOX + ' — chưa cấu hình Sheet';
        document.getElementById('menuList').innerHTML = '<p style="color:#c00000;text-align:center;padding:20px;">Không thể order</p>';
        return;
      }
      try {
        const res = await fetch(SHEET_API + '?action=checkRoom&box=' + BOX + '&t=' + Date.now());
        const data = await res.json();
        if (data.ok && data.occupied) {
          ROOM_OK = true;
          document.getElementById('boxLabel').textContent = 'Phòng BOX ' + BOX + (data.invoiceCode ? ' — ' + data.invoiceCode : '');
          renderMenu();
        } else {
          ROOM_OK = false;
          document.getElementById('boxLabel').textContent = 'BOX ' + BOX + ' — chưa có khách';
          document.getElementById('menuList').innerHTML = '<p style="color:#c00000;text-align:center;padding:24px;background:#fff;border-radius:10px;">Phòng đang trống.<br>Chỉ order khi phòng đã có khách (ô đỏ).</p>';
          document.getElementById('btnSend').disabled = true;
        }
      } catch (e) {
        document.getElementById('boxLabel').textContent = 'Lỗi kết nối';
      }
    }

    const catState = {};
    function toggleCat(cat) {
      catState[cat] = !catState[cat];
      renderMenu();
    }
    
    
    function slugifyName(name) {
      if (!name) return '';
      var s = String(name).trim().toLowerCase();
      var map = {'à':'a','á':'a','ạ':'a','ả':'a','ã':'a','â':'a','ầ':'a','ấ':'a','ậ':'a','ẩ':'a','ẫ':'a','ă':'a','ằ':'a','ắ':'a','ặ':'a','ẳ':'a','ẵ':'a','è':'e','é':'e','ẹ':'e','ẻ':'e','ẽ':'e','ê':'e','ề':'e','ế':'e','ệ':'e','ể':'e','ễ':'e','ì':'i','í':'i','ị':'i','ỉ':'i','ĩ':'i','ò':'o','ó':'o','ọ':'o','ỏ':'o','õ':'o','ô':'o','ồ':'o','ố':'o','ộ':'o','ổ':'o','ỗ':'o','ơ':'o','ờ':'o','ớ':'o','ợ':'o','ở':'o','ỡ':'o','ù':'u','ú':'u','ụ':'u','ủ':'u','ũ':'u','ư':'u','ừ':'u','ứ':'u','ự':'u','ử':'u','ữ':'u','ỳ':'y','ý':'y','ỵ':'y','ỷ':'y','ỹ':'y','đ':'d'};
      s = s.split('').map(function(c){ return map[c] || c; }).join('');
      return s.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }
    /** Tự tìm ảnh trong Menu_images theo mã món hoặc tên (không cần cột Ảnh) */
    function resolveMenuImage(src, code, name) {
      var base;
      try { base = new URL('.', location.href).href; } catch (e) { base = location.origin + '/'; }
      function url(path) {
        try { return new URL(path, base).href; } catch (e) { return path; }
      }
      if (src && String(src).trim()) {
        src = String(src).trim().replace(/^\.\//, '');
        if (/^https?:\/\//i.test(src) || src.indexOf('data:') === 0) return [src];
        if (src.indexOf('/') === -1) src = 'Menu_images/' + src;
        return [url(src)];
      }
      var list = [];
      if (code) {
        ['png','jpg','jpeg','webp'].forEach(function(ext){ list.push(url('Menu_images/' + code + '.' + ext)); });
      }
      var slug = slugifyName(name);
      if (slug) {
        ['png','jpg'].forEach(function(ext){ list.push(url('Menu_images/' + slug + '.' + ext)); });
        var titled = slug.split('-').map(function(w){ return w ? w.charAt(0).toUpperCase() + w.slice(1) : ''; }).join('-');
        ['png','jpg'].forEach(function(ext){ list.push(url('Menu_images/' + titled + '.' + ext)); });
      }
      return list;
    }
    function menuImgTag(item) {
      var list = resolveMenuImage(item.image, item.code || item.id, item.name);
      if (!list.length) return '<div class="menu-item-img placeholder">🍽</div>';
      var fb = JSON.stringify(list).replace(/'/g, '&#39;');
      return '<img class="menu-item-img" src="' + list[0] + '" alt="" data-fallbacks=\'' + fb + '\' data-fi="0" onerror="menuImgFallback(this)">';
    }
    function menuImgFallback(el) {
      try {
        var list = JSON.parse(el.getAttribute('data-fallbacks') || '[]');
        var i = parseInt(el.getAttribute('data-fi') || '0', 10) + 1;
        if (i < list.length) { el.setAttribute('data-fi', String(i)); el.src = list[i]; return; }
      } catch (e) {}
      el.outerHTML = '<div class="menu-item-img placeholder">🍽</div>';
    }

function renderMenu() {
      const list = document.getElementById('menuList');
      if (!MENU.length) {
        list.innerHTML = '<p style="text-align:center;color:#888">Không có món</p>';
        updateCart();
        return;
      }
      const groups = {}, order = [];
      MENU.forEach(item => {
        const cat = item.category || 'Khác';
        if (!groups[cat]) { groups[cat] = []; order.push(cat); }
        groups[cat].push(item);
      });
      list.innerHTML = order.map(cat => {
        const collapsed = !!catState[cat];
        const body = groups[cat].map(item => {
          const q = qtyMap[item.id] || 0;
          const stock = item.stock != null ? item.stock : '—';
          const out = item.stock != null && item.stock <= 0;
          const img = menuImgTag(item);
          return `<div class="menu-item">
            ${img}
            <div class="menu-item-name" style="${out ? 'opacity:0.5' : ''}"><small>${item.code || ''}</small>${item.name}
              <small style="display:block;color:${out ? '#c00000' : '#70ad47'}">Còn: ${stock}</small>
            </div>
            <div class="menu-item-price" style="${out ? 'opacity:0.5' : ''}">${money(item.price)}</div>
            <div class="qty-control">
              <button class="qty-btn" onclick="chg('${item.id}',-1)" ${q <= 0 ? 'disabled' : ''}>−</button>
              <span class="qty-val" id="q-${item.id}">${q}</span>
              <button class="qty-btn" onclick="chg('${item.id}',1)" ${out ? 'disabled' : ''}>+</button>
            </div>
          </div>`;
        }).join('');
        return `<div class="menu-cat ${collapsed ? 'collapsed' : ''}">
          <div class="menu-cat-header" onclick="toggleCat('${String(cat).replace(/'/g, "\'")}')">
            <span>${cat} (${groups[cat].length})</span><span class="arrow">▼</span>
          </div>
          <div class="menu-cat-body">${body}</div>
        </div>`;
      }).join('');
      updateCart();
    }

    function chg(id, d) {
      const item = MENU.find(m => m.id === id);
      const cur = qtyMap[id] || 0;
      let next = cur + d;
      if (next < 0) next = 0;
      if (d > 0 && item && item.stock != null && item.stock <= 0) {
        toast('Hết hàng');
        return;
      }
      if (d > 0 && item && item.stock != null && next > cur + item.stock) {
        next = cur + item.stock;
        toast('Chỉ còn ' + item.stock);
      }
      if (next === 0) delete qtyMap[id]; else qtyMap[id] = next;
      updateCart();
      renderMenu();
    }

    function updateCart() {
      let total = 0, html = '', count = 0;
      for (const [id, qty] of Object.entries(qtyMap)) {
        const item = MENU.find(m => m.id === id);
        if (!item || qty <= 0) continue;
        total += item.price * qty;
        count += qty;
        html += `<div class="cart-line"><span>${item.name} x${qty}</span><span>${money(item.price * qty)}</span></div>`;
      }
      document.getElementById('cartLines').innerHTML = html || '<div style="color:#888">Chưa chọn món</div>';
      document.getElementById('cartTotal').textContent = money(total);
      document.getElementById('btnSend').disabled = count === 0;
    }

    document.getElementById('barcodeInput').addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const code = e.target.value.trim();
      e.target.value = '';
      const item = MENU.find(m => String(m.code) === code || String(m.id) === code);
      if (!item) { toast('Không có món: ' + code); return; }
      chg(item.id, 1);
      toast('+' + item.name);
    });

    document.getElementById('btnSend').onclick = async () => {
      const items = [];
      for (const [id, qty] of Object.entries(qtyMap)) {
        const item = MENU.find(m => m.id === id);
        if (item && qty > 0) {
          items.push({ id, code: item.code || id, name: item.name, price: item.price, qty });
        }
      }
      if (!items.length) return;

      if (!SHEET_API) {
        toast('Chưa cấu hình sheetApiUrl');
        return;
      }

      if (!ROOM_OK) { toast('Phòng chưa có khách'); return; }
      document.getElementById('btnSend').disabled = true;
      try {
        const res = await fetch(SHEET_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'customerOrder',
            order: {
              box: BOX,
              items,
              note: document.getElementById('orderNote').value.trim(),
              time: new Date().toISOString()
            }
          })
        });
        let data = {};
        try { data = await res.json(); } catch (_) {}
        if (data.ok === false) {
          toast(data.error || 'Không nhận order');
          document.getElementById('btnSend').disabled = false;
          return;
        }
        toast('Đã gửi order cho quầy!');
        qtyMap = {};
        document.getElementById('orderNote').value = '';
        await refreshStock();
        renderMenu();
      } catch (err) {
        toast('Gửi lỗi, thử lại');
        document.getElementById('btnSend').disabled = false;
      }
    };

    async function refreshStock() {
      if (!SHEET_API || !ROOM_OK) return;
      try {
        const ir = await fetch(SHEET_API + '?action=inventory&t=' + Date.now());
        const idata = await ir.json();
        if (idata.ok && idata.items) {
          const map = {};
          idata.items.forEach(it => { map[String(it.code)] = Number(it.stock) || 0; });
          MENU.forEach(m => {
            if (map.hasOwnProperty(m.code)) m.stock = map[m.code];
          });
          renderMenu();
        }
      } catch (_) {}
    }

    // Cập nhật tồn kho mỗi 5 giây
    setInterval(refreshStock, 5000);

    loadConfig();
  </script>
</body>
</html>
