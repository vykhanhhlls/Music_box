<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Music Box</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
    .sub { text-align: center; color: #666; margin-bottom: 16px; font-size: 14px; }
    .scan-row {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .scan-row input {
      flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
    }
    .menu-item {
      display: flex; align-items: center; justify-content: space-between;
      background: white; border-radius: 10px; padding: 12px; margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .menu-item-name { flex: 1; }
    .menu-item-name small { color: #888; display: block; }
    .menu-item-price { width: 70px; text-align: right; color: #c00000; font-weight: 600; }
    .qty-control { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: #c00000; color: white; font-size: 18px; cursor: pointer;
    }
    .qty-val { min-width: 24px; text-align: center; font-weight: 600; }
    .cart {
      position: sticky; bottom: 0; background: white; border-radius: 12px 12px 0 0;
      padding: 16px; box-shadow: 0 -4px 16px rgba(0,0,0,0.12); margin-top: 16px;
    }
    .cart h3 { margin-bottom: 8px; }
    .cart-line { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; }
    .cart-total { font-weight: bold; font-size: 18px; color: #c00000; margin-top: 8px; }
    .btn-send {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #70ad47; color: white; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 12px;
    }
    .btn-send:disabled { background: #aaa; }
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: #333; color: white; padding: 12px 20px; border-radius: 8px;
      display: none; z-index: 100;
    }
    .toast.show { display: block; }
    .note-input {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
      margin-top: 8px; font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Music Box — Menu</h1>
  <div class="sub" id="boxLabel">Đang tải...</div>

  <div class="scan-row">
    <input type="text" id="barcodeInput" placeholder="Quét mã vạch món..." autocomplete="off">
  </div>

  <div id="menuList"></div>

  <div class="cart">
    <h3>Đã chọn</h3>
    <div id="cartLines"></div>
    <div class="cart-total">Tổng: <span id="cartTotal">0</span> đ</div>
    <input class="note-input" id="orderNote" placeholder="Ghi chú (tuỳ chọn)">
    <button class="btn-send" id="btnSend" disabled>Gửi order cho quầy</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const BOX = parseInt(params.get('box') || '0', 10);
    let MENU = [];
    let SHEET_API = '';
    let qtyMap = {};

    function money(n) { return Math.round(n).toLocaleString('vi-VN'); }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    async function loadConfig() {
      try {
        const res = await fetch('config.json?t=' + Date.now());
        const cfg = await res.json();
        MENU = cfg.menu || [];
        SHEET_API = (cfg.sheetApiUrl || '').trim();
      } catch (e) {
        MENU = [];
      }
      if (!BOX || BOX < 1 || BOX > 6) {
        document.getElementById('boxLabel').textContent = 'Thiếu số phòng (?box=1)';
        return;
      }
      document.getElementById('boxLabel').textContent = 'Phòng BOX ' + BOX;
      renderMenu();
    }

    function renderMenu() {
      const list = document.getElementById('menuList');
      list.innerHTML = MENU.map(item => {
        const q = qtyMap[item.id] || 0;
        return `<div class="menu-item">
          <div class="menu-item-name"><small>${item.code || ''}</small>${item.name}</div>
          <div class="menu-item-price">${money(item.price)}</div>
          <div class="qty-control">
            <button class="qty-btn" onclick="chg('${item.id}',-1)">−</button>
            <span class="qty-val" id="q-${item.id}">${q}</span>
            <button class="qty-btn" onclick="chg('${item.id}',1)">+</button>
          </div>
        </div>`;
      }).join('');
      updateCart();
    }

    function chg(id, d) {
      const cur = qtyMap[id] || 0;
      const next = Math.max(0, cur + d);
      if (next === 0) delete qtyMap[id]; else qtyMap[id] = next;
      const el = document.getElementById('q-' + id);
      if (el) el.textContent = next;
      updateCart();
    }

    function updateCart() {
      let total = 0, html = '', count = 0;
      for (const [id, qty] of Object.entries(qtyMap)) {
        const item = MENU.find(m => m.id === id);
        if (!item || qty <= 0) continue;
        total += item.price * qty;
        count += qty;
        html += `<div class="cart-line"><span>${item.name} x${qty}</span><span>${money(item.price * qty)}</span></div>`;
      }
      document.getElementById('cartLines').innerHTML = html || '<div style="color:#888">Chưa chọn món</div>';
      document.getElementById('cartTotal').textContent = money(total);
      document.getElementById('btnSend').disabled = count === 0;
    }

    document.getElementById('barcodeInput').addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const code = e.target.value.trim();
      e.target.value = '';
      const item = MENU.find(m => String(m.code) === code || String(m.id) === code);
      if (!item) { toast('Không có món: ' + code); return; }
      chg(item.id, 1);
      toast('+' + item.name);
    });

    document.getElementById('btnSend').onclick = async () => {
      const items = [];
      for (const [id, qty] of Object.entries(qtyMap)) {
        const item = MENU.find(m => m.id === id);
        if (item && qty > 0) {
          items.push({ id, code: item.code || id, name: item.name, price: item.price, qty });
        }
      }
      if (!items.length) return;

      if (!SHEET_API) {
        toast('Chưa cấu hình sheetApiUrl');
        return;
      }

      document.getElementById('btnSend').disabled = true;
      try {
        await fetch(SHEET_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'customerOrder',
            order: {
              box: BOX,
              items,
              note: document.getElementById('orderNote').value.trim(),
              time: new Date().toISOString()
            }
          })
        });
        toast('Đã gửi order cho quầy!');
        qtyMap = {};
        document.getElementById('orderNote').value = '';
        renderMenu();
      } catch (err) {
        toast('Gửi lỗi, thử lại');
        document.getElementById('btnSend').disabled = false;
      }
    };

    loadConfig();
  </script>
</body>
</html>
